[project]
name = "sf-local-architect"
version = "0.4.0"
description = "Local offline Salesforce architect MCP server for Cursor and Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "fastembed>=0.6",
    "fastmcp>=3.4",
    "lancedb>=0.22",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
scrape = ["crawl4ai>=0.8"]
# Bundled sf-compress (sfc) exploration-graph extra; opt-in (needs Python 3.10+).
graph = ["graphify-sf==0.4.1"]

[project.scripts]
sf-architect = "sf_architect.cli:main"
sf-architect-mcp = "sf_architect.server:main"
# Bundled sf-compress dev-support CLI.
sfc = "sfc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Keep the source distribution to the Python project only. Without this,
# hatchling includes everything not gitignored — notably the committed
# `extension/` bundle and its `node_modules/`, bloating the sdist to ~31 MB.
# Leading slashes anchor to the project root; unanchored names like
# "README.md" would otherwise match nested files (e.g. under node_modules).
include = [
    "/src",
    "/data/limits_seed.yaml",
    "/data/patterns_seed.yaml",
    "/skills",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sf_architect", "src/sfc"]

# Ship the curated seed data inside the wheel so `sf-architect seed` works for
# users who install from PyPI (e.g. via `uv tool install` / `uvx`) and never
# clone the repo. The files stay at the repo-root `data/` for dev + tests.
[tool.hatch.build.targets.wheel.force-include]
"data/limits_seed.yaml" = "sf_architect/data/limits_seed.yaml"
"data/patterns_seed.yaml" = "sf_architect/data/patterns_seed.yaml"
# Ship the bundled Agent Skill inside the wheel so `sf-architect install-skill`
# works for users who install from PyPI and never clone the repo.
"skills/local-sf-architect/SKILL.md" = "sf_architect/skills/local-sf-architect/SKILL.md"
"skills/local-sf-architect/references/tools.md" = "sf_architect/skills/local-sf-architect/references/tools.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The bundled sf-compress (sfc) package and its tests are merged verbatim from an
# upstream project with its own style; exclude them from the engine's lint so we
# hold engine-authored code to the engine standard without diverging from upstream.
extend-exclude = [
    "src/sfc",
    "bundle",
    "tests/synth.py",
    "tests/test_cli.py",
    "tests/test_delta.py",
    "tests/test_filters.py",
    "tests/test_graph.py",
    "tests/test_mcp_server.py",
    "tests/test_setup.py",
    "tests/test_workbench.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
